<!DOCTYPE html>
<html>

<head>
    <link type="image/png" sizes="16x16" rel="icon" href="./icons/icons8-font-color-16.png">
    <link type="image/png" sizes="32x32" rel="icon" href="./icons/icons8-font-color-32.png">
    <link type="image/png" sizes="96x96" rel="icon" href="./icons/icons8-font-color-96.png">

    <title>TrueType to Bitmap Converter</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="./style.css" rel="stylesheet"/>
</head>

<body>
<div class="container">
    <div class="header">TrueType to Bitmap Font Converter</div>

    <div class="block font">
        <div class="field">
            <h3>Font</h3>
            <select id="font-select"></select>
        </div>
        <button id="upload-font">Upload</button>
    </div>

    <div class="block parameters">
        <div class="fields">
            <div class="field">
                <h3>Font Size (pt)</h3>
                <input type="number" id="size-field" value="20" min="1" step="0.5">
            </div>

            <div class="field">
                <h3>Demo text</h3>
                <input type="text" id="text-field" value="Hello, World!">
            </div>

            <div class="field">
                <h3>Glyphs range</h3>
                <select id="range-select"></select>
                <input type="text" id="custom-range-field" placeholder=":russian:;:basic_european:;0x20ac" hidden>
            </div>

            <div class="field">
                <h3>Export format</h3>
                <select id="format-select"></select>
            </div>

            <div class="field" id="bpp-field">
                <h3>Bitmap depth</h3>
                <select id="bpp-select"></select>
            </div>

            <div class="field" id="abi-profile-field">
                <h3>ABI profile</h3>
                <select id="abi-profile-select"></select>
            </div>

            <div class="field">
                <h3>Glyph layout</h3>
                <select id="range-mode-select"></select>
            </div>

            <div class="strict-row">
                <label class="strict-option" for="strict-field">
                    <input type="checkbox" id="strict-field">
                    <span>Strict export</span>
                </label>
                <span class="help-tip" tabindex="0" role="note"
                      aria-label="Strict export stops generation when the selected font is missing any requested glyph."
                      data-tooltip="Stops export if any selected code point is missing from the font. Without strict mode, missing glyphs are listed and skipped.">?</span>
            </div>
        </div>

        <div class="actions">
            <button id="get-font">Get Font File</button>
            <button id="get-all-fonts">Get All Fonts</button>
        </div>
    </div>

    <div class="block preview">
        <canvas id="preview"></canvas>
    </div>

    <div class="block stats">
        <div id="stats"></div>
        <div id="issues" role="status" hidden></div>
    </div>
</div>

<footer>
    Icons by <a href="https://icons8.com/" target="_blank">Icon8</a>
</footer>
<script src="./index.js" type="module"></script>
</body>

</html>
